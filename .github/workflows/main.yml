name: Auto Build Flatpak (Multi-Arch)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detector:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.get_tag.outputs.tag }}
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Install jq and git
        run: sudo apt-get update && sudo apt-get install -y jq git curl

      - name: Get latest upstream release tag
        id: get_tag
        run: |
          TAG=$(curl -s https://api.github.com/repos/Mystic-Stars/Axolotl/releases/latest | jq -r '.tag_name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check if tag already built
        id: check
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          if git ls-remote --tags https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/cyf112233/Axolotl-fork.git refs/tags/$TAG | grep -q .; then
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  build-flatpak-x86_64:
    needs: detector
    if: needs.detector.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      NEW_TAG: ${{ needs.detector.outputs.new_tag }}
      ARCH: x86_64
    steps:
      - name: Cleanup disk
        run: |
          rm -rf ~/.npm ~/.pnpm-store ~/.cache
          sudo docker system prune -af 2>/dev/null || true
          df -h

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Generate flatpak manifest
        run: |
          cat > red.ghs.axolotl.yml <<EOF
          id: red.ghs.axolotl
          runtime: org.kde.Platform
          runtime-version: "6.6"
          sdk: org.kde.Sdk
          command: "Axolotl Launcher"

          sdk-extensions:
            - org.freedesktop.Sdk.Extension.rust-stable

          finish-args:
            - --socket=wayland
            - --socket=fallback-x11
            - --device=dri
            - --share=ipc
            - --socket=pulseaudio

          build-options:
            append-path: /usr/lib/sdk/rust-stable/bin
            env:
              SQLX_OFFLINE: "true"
              build-args:
              - --share=network

          modules:
            - name: axolotl
              buildsystem: simple
              build-commands:
                - git fetch --tags
                - git checkout tags/$NEW_TAG
                - git submodule update --init --recursive
                - curl -L https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-$(uname -m).tar.xz | tar -xJ -C /app
                - export PATH=/app/node-v22.14.0-linux-$(uname -m)/bin:\$PATH
                - npm install -g pnpm
                - cd apps/app
                - pnpm install --no-frozen-lockfile
                - pnpm run build
                - cd ../..
                - cd apps/app
                - cargo build --release
                - install -Dm755 "target/release/Axolotl Launcher" "/app/bin/Axolotl Launcher"
                - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/128x128/apps/red.ghs.axolotl.png
                - install -Dm644 src-tauri/tauri.desktop /app/share/applications/red.ghs.axolotl.desktop
              sources:
                - type: git
                  url: https://github.com/Mystic-Stars/Axolotl.git
                  branch: master
          EOF
          sed -i "s/\$NEW_TAG/$NEW_TAG/g" red.ghs.axolotl.yml

      - name: Build Flatpak package
        run: |
          flatpak-builder --force-clean --user --install-deps-from=flathub --repo=repo builddir red.ghs.axolotl.yml
          flatpak build-bundle repo red.ghs.axolotl-$ARCH.flatpak red.ghs.axolotl

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release create "$NEW_TAG" --repo cyf112233/Axolotl-fork --title "Axolotl $NEW_TAG" --notes "Automated Flatpak build" || true
          gh release upload "$NEW_TAG" red.ghs.axolotl-$ARCH.flatpak --repo cyf112233/Axolotl-fork --clobber

  build-flatpak-arm64:
    needs: detector
    if: needs.detector.outputs.should_run == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      NEW_TAG: ${{ needs.detector.outputs.new_tag }}
      ARCH: aarch64
    steps:
      - name: Cleanup disk
        run: |
          rm -rf ~/.npm ~/.pnpm-store ~/.cache
          sudo docker system prune -af 2>/dev/null || true
          df -h

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Generate flatpak manifest
        run: |
          cat > red.ghs.axolotl.yml <<EOF
          id: red.ghs.axolotl
          runtime: org.kde.Platform
          runtime-version: "6.6"
          sdk: org.kde.Sdk
          command: "Axolotl Launcher"

          sdk-extensions:
            - org.freedesktop.Sdk.Extension.rust-stable

          finish-args:
            - --socket=wayland
            - --socket=fallback-x11
            - --device=dri
            - --share=ipc
            - --socket=pulseaudio

          build-options:
            append-path: /usr/lib/sdk/rust-stable/bin
            env:
              SQLX_OFFLINE: "true"
            build-args:
              - --share=network

          modules:
            - name: axolotl
              buildsystem: simple
              build-commands:
                - git fetch --tags
                - git checkout tags/$NEW_TAG
                - git submodule update --init --recursive
                - curl -L https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-$(uname -m).tar.xz | tar -xJ -C /app
                - export PATH=/app/node-v22.14.0-linux-$(uname -m)/bin:\$PATH
                - npm install -g pnpm
                - cd apps/app
                - pnpm install --no-frozen-lockfile
                - pnpm run build
                - cd ../..
                - cd apps/app
                - cargo build --release
                - install -Dm755 "target/release/Axolotl Launcher" "/app/bin/Axolotl Launcher"
                - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/128x128/apps/red.ghs.axolotl.png
                - install -Dm644 src-tauri/tauri.desktop /app/share/applications/red.ghs.axolotl.desktop
              sources:
                - type: git
                  url: https://github.com/Mystic-Stars/Axolotl.git
                  branch: master
          EOF
          sed -i "s/\$NEW_TAG/$NEW_TAG/g" red.ghs.axolotl.yml

      - name: Build Flatpak package
        run: |
          flatpak-builder --force-clean --user --install-deps-from=flathub --repo=repo builddir red.ghs.axolotl.yml
          flatpak build-bundle repo red.ghs.axolotl-$ARCH.flatpak red.ghs.axolotl

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release create "$NEW_TAG" --repo cyf112233/Axolotl-fork --title "Axolotl $NEW_TAG" --notes "Automated Flatpak build" || true
          gh release upload "$NEW_TAG" red.ghs.axolotl-$ARCH.flatpak --repo cyf112233/Axolotl-fork --clobber
