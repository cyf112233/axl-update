name: Auto Sync Upstream Release to Fork (Full Generation)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl git
      - name: Get latest upstream release
        id: upstream
        run: |
          RESPONSE=$(curl -s https://api.github.com/repos/Mystic-Stars/Axolotl/releases/latest)
          TAG=$(echo "$RESPONSE" | jq -r '.tag_name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check if tag already exists in fork
        id: check_tag
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          if git ls-remote --tags https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/cyf112233/Axolotl-fork.git refs/tags/$TAG | grep -q .; then
            echo "Tag $TAG already exists in fork, skipping."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG does not exist, will sync."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if already synced
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "Already up to date with ${{ steps.upstream.outputs.tag }}"
          exit 0

      - name: Setup flatpak builder tools
        run: |
          sudo apt-get install -y pipx
          pipx ensurepath
          pipx install git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          rm -rf flatpak-builder-tools
          git clone https://github.com/flatpak/flatpak-builder-tools.git
          pip install aiohttp tomlkit PyYAML
          
      - name: Generate and push
        run: |
          NEW_TAG="${{ steps.upstream.outputs.tag }}"
          NEW_URL="https://github.com/Mystic-Stars/Axolotl/archive/refs/tags/${NEW_TAG}.tar.gz"
          echo "Syncing release: $NEW_TAG"

          mkdir -p workspace
          cd workspace
          curl -L --retry 3 --retry-delay 2 "$NEW_URL" -o source.tar.gz
          if [ ! -f source.tar.gz ]; then
            echo "Download failed"
            exit 1
          fi
          SHA256=$(sha256sum source.tar.gz | awk '{print $1}')
          tar -xzf source.tar.gz
          if [ $? -ne 0 ]; then
            echo "Failed to extract source archive"
            exit 1
          fi
          SOURCE_DIR=$(tar -tf source.tar.gz | head -1 | cut -d'/' -f1)
          cd "$SOURCE_DIR"
          echo "Generating cargo-sources.json..."
          python3 ../../flatpak-builder-tools/cargo/flatpak-cargo-generator.py Cargo.lock -o cargo-sources.json
          if [ $? -ne 0 ]; then
            echo "Failed to generate cargo-sources.json"
            exit 1
          fi
          echo "Generating pnpm-sources.json..."
          flatpak-node-generator pnpm pnpm-lock.yaml -o pnpm-sources.json
          if [ $? -ne 0 ]; then
            echo "pnpm generation failed, trying npm fallback..."
            npm install --package-lock-only
            flatpak-node-generator npm package-lock.json -o pnpm-sources.json
          fi
          cat > red.ghs.axolotl.yml <<EOF
          id: red.ghs.axolotl
          runtime: org.gnome.Platform
          runtime-version: '44'
          sdk: org.gnome.Sdk
          command: axolotl

          finish-args:
            - --socket=wayland
            - --socket=fallback-x11
            - --device=dri
            - --share=ipc
            - --socket=pulseaudio

          modules:
            - name: cargo-deps
              buildsystem: simple
              build-commands: [ echo "Cargo deps ready" ]
              sources:
                - type: file
                  path: cargo-sources.json

            - name: pnpm-deps
              buildsystem: simple
              build-commands: [ echo "pnpm deps ready" ]
              sources:
                - type: file
                  path: pnpm-sources.json

            - name: axolotl
              buildsystem: simple
              build-commands:
                - export SQLX_OFFLINE=true
                - corepack enable
                - corepack prepare pnpm@latest --activate
                - pnpm install --frozen-lockfile --offline
                - cd apps/app
                - pnpm tauri build --config tauri-release.conf.json --bundles none
                - install -Dm755 "target/release/Axolotl Launcher" "/app/bin/Axolotl Launcher"
                - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/128x128/apps/red.ghs.axolotl.png
                - install -Dm644 src-tauri/tauri.desktop /app/share/applications/red.ghs.axolotl.desktop
              sources:
                - type: archive
                  url: $NEW_URL
                  sha256: $SHA256
          EOF

          echo "$NEW_TAG" > .current_version
          cd ../../
          rm -rf fork-repo
          git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/cyf112233/Axolotl-fork.git fork-repo
          cd fork-repo
          git checkout --orphan flathub 2>/dev/null || git checkout flathub
          rm -rf *
          cp ../workspace/$SOURCE_DIR/red.ghs.axolotl.yml .
          cp ../workspace/$SOURCE_DIR/cargo-sources.json .
          cp ../workspace/$SOURCE_DIR/pnpm-sources.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf .
          git add red.ghs.axolotl.yml
          git add cargo-sources.json
          git add pnpm-sources.json
          git commit -m "chore: sync to upstream release $NEW_TAG"
          git push --force origin flathub
          git tag -f "$NEW_TAG"
          git push --force origin "$NEW_TAG"

      - name: Log status
        if: steps.check_tag.outputs.exists == 'true'
        run: echo "Already up to date with ${{ steps.upstream.outputs.tag }}"
