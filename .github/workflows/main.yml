name: Build Flatpak Repo (Multi-Arch)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detector:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.get_tag.outputs.tag }}
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq git curl

      - name: Get latest upstream release tag
        id: get_tag
        run: |
          TAG=$(curl -s https://api.github.com/repos/Mystic-Stars/Axolotl/releases/latest | jq -r '.tag_name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check if tag already built in fork
        id: check
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          if git ls-remote --tags https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/cyf112233/Axolotl-fork.git refs/tags/$TAG | grep -q .; then
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detector
    if: needs.detector.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            appimage_suffix: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            appimage_suffix: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      NEW_TAG: ${{ needs.detector.outputs.new_tag }}
      ARCH: ${{ matrix.arch }}
      APPIMAGE_SUFFIX: ${{ matrix.appimage_suffix }}
    steps:
      - name: Cleanup disk
        run: |
          rm -rf ~/.npm ~/.pnpm-store ~/.cache
          sudo docker system prune -af 2>/dev/null || true
          df -h

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Generate flatpak manifest (KDE 6.6)
        run: |
          VERSION=${NEW_TAG#v}
          APPIMAGE_NAME="Axolotl.Launcher_${VERSION}_${APPIMAGE_SUFFIX}.AppImage"
          APPIMAGE_URL="https://github.com/Mystic-Stars/Axolotl/releases/download/$NEW_TAG/$APPIMAGE_NAME"
          
          curl -L -o "$APPIMAGE_NAME" "$APPIMAGE_URL"
          SHA256=$(sha256sum "$APPIMAGE_NAME" | awk '{print $1}')
          
          cat > red.ghs.axolotl.yml <<EOF
          id: red.ghs.axolotl
          runtime: org.kde.Platform
          runtime-version: "6.6"
          sdk: org.kde.Sdk
          command: run-axolotl.sh
          finish-args:
            - --socket=x11
            - --socket=wayland
            - --share=network
            - --device=dri
            - --filesystem=home
          modules:
            - name: axolotl
              buildsystem: simple
              sources:
                - type: file
                  url: $APPIMAGE_URL
                  sha256: $SHA256
                  dest-filename: appimage.AppImage
              build-commands:
                - install -Dm755 appimage.AppImage /app/axolotl/Axolotl\ Launcher
                - mkdir -p /app/bin
                - echo '#!/bin/sh' > /app/bin/run-axolotl.sh
                - echo 'export APPIMAGE_EXTRACT_AND_RUN=1' >> /app/bin/run-axolotl.sh
                - echo 'exec /app/axolotl/Axolotl\ Launcher "\$@"' >> /app/bin/run-axolotl.sh
                - chmod +x /app/bin/run-axolotl.sh
          EOF

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build Flatpak and generate ostree repo (user mode)
        run: |
          KEY_ID=${{ steps.import-gpg.outputs.fingerprint }}
          echo "Using key ID: $KEY_ID"
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          flatpak-builder --user \
            --force-clean \
            --install-deps-from=flathub \
            --gpg-sign="$KEY_ID" \
            --repo=repo \
            builddir \
            red.ghs.axolotl.yml

      - name: Sign flatpak summary
        run: |
          ostree --repo=repo summary -u --gpg-sign="$KEY_ID"
          ls -la repo/summary*
          
      - name: Package ostree repo
        run: tar -czf repo-${ARCH}.tar.gz repo/

      - name: Upload repo tarball to Release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh release create "$NEW_TAG" --repo cyf112233/Axolotl-fork --title "Axolotl $NEW_TAG" --notes "Flatpak builds" || true
          gh release upload "$NEW_TAG" repo-${ARCH}.tar.gz --repo cyf112233/Axolotl-fork --clobber

      - name: Upload individual repo files (summary, sig, config)
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          cd repo
          for file in summary summary.sig config; do
            if [ -f "$file" ]; then
              newname="${file}-${ARCH}"
              cp "$file" "$newname"
              gh release upload "$NEW_TAG" "$newname" --repo cyf112233/Axolotl-fork --clobber
            fi
          done

      - name: Push repo to flatpak-${ARCH} branch
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          BRANCH_NAME="flatpak-${ARCH}"   # flatpak-amd64 或 flatpak-aarch64
          cd repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update Flatpak repo for $NEW_TAG"
          git remote add origin https://x-access-token:$GH_TOKEN@github.com/cyf112233/Axolotl-fork.git
          git push --force origin HEAD:$BRANCH_NAME
  tag:
    needs: [detector, build]
    if: always() && !cancelled() && !contains(needs.build.result, 'failure')
    runs-on: ubuntu-latest
    env:
      NEW_TAG: ${{ needs.detector.outputs.new_tag }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: cyf112233/Axolotl-fork
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$NEW_TAG"
          git push --force origin "$NEW_TAG"
